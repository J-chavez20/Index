<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Escáner de Asistencia</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; padding: 20px; margin: 0; text-align: center; }
    .card { max-width: 450px; margin: 0 auto; background: #fff; padding: 25px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    h2 { color: #1a73e8; margin-top: 0; }
    #reader { width: 100%; border-radius: 12px; overflow: hidden; margin-bottom: 15px; }
    #msg { margin-top: 15px; padding: 12px; border-radius: 8px; font-weight: bold; display: none; }
    .ok { background-color: #d4edda; color: #155724; display: block !important; }
    .error { background-color: #f8d7da; color: #721c24; display: block !important; }
    .nav { margin-top: 20px; border-top: 1px solid #eee; padding-top: 15px; }
    .nav a { color: #1a73e8; text-decoration: none; font-size: 14px; margin: 0 8px; font-weight: 500; }
  </style>
</head>
<body>

  <div class="card">
    <h2>📷 Control de Asistencia</h2>
    <div id="reader"></div>
    <div id="msg"></div>

    <div class="nav">
      <a href="consulta.html">🔍 Consulta de Asistencia</a> | 
      <a href="registro.html">📝 Registrar Alumno</a>
    </div>
  </div>

  <script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzwrXe5Dzaiyq57gOvhKVTB8SJlLUZLdCmXDhKEdkAFxItRSL1lPum43yLUeP1AM7z_/exec";
    let escaneando = false;

    function onScanSuccess(decodedText) {
      if (escaneando) return;
      escaneando = true;

      const msg = document.getElementById('msg');
      msg.className = "";
      msg.style.display = "block";
      msg.innerText = "⏳ Procesando asistencia...";

      fetch(`${WEB_APP_URL}?qr=${encodeURIComponent(decodedText)}`)
        .then(res => res.json())
        .then(data => {
          if (data.estado === 'ok') {
            msg.className = "ok";
            msg.innerText = `✅ ¡Asistencia registrada!\n${data.nombre} (${data.hora})`;
          } else {
            msg.className = "error";
            msg.innerText = "❌ " + data.mensaje;
          }
          setTimeout(() => { escaneando = false; }, 3000);
        })
        .catch(err => {
          msg.className = "error";
          msg.innerText = "❌ Error al conectar con el servidor.";
          setTimeout(() => { escaneando = false; }, 3000);
        });
    }

    const html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: 250 });
    html5QrcodeScanner.render(onScanSuccess);
  </script>

</body>
</html>
