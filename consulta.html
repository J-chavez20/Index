<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Consulta de Asistencia</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; padding: 20px; margin: 0; }
    .card { max-width: 500px; margin: 0 auto; background: #fff; padding: 25px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    h2 { color: #1a73e8; margin-top: 0; text-align: center; }
    .form-group { margin-bottom: 15px; }
    input { width: 100%; padding: 10px; font-size: 15px; border: 1px solid #ccc; border-radius: 8px; outline: none; text-transform: uppercase; }
    button { width: 100%; padding: 12px; font-size: 16px; font-weight: bold; color: white; background-color: #1a73e8; border: none; border-radius: 8px; cursor: pointer; }
    button:hover { background-color: #1557b0; }
    #resultado { margin-top: 20px; text-align: left; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { border: 1px solid #ddd; padding: 8px; text-align: center; font-size: 14px; }
    th { background-color: #f8f9fa; }
    .nav { text-align: center; margin-top: 20px; border-top: 1px solid #eee; padding-top: 15px; }
    .nav a { color: #1a73e8; text-decoration: none; font-size: 14px; margin: 0 8px; font-weight: 500; }
  </style>
</head>
<body>

  <div class="card">
    <h2>🔍 Consulta de Asistencia</h2>
    
    <div class="form-group">
      <input type="text" id="codigo" placeholder="Ingrese Código del Estudiante" onkeypress="if(event.key==='Enter') buscarAsistencia()">
    </div>
    <button onclick="buscarAsistencia()">Buscar Registros</button>

    <div id="resultado"></div>

    <div class="nav">
      <a href="index.html">📷 Escáner</a> | 
      <a href="registro.html">📝 Registrar Alumno</a>
    </div>
  </div>

  <script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzwrXe5Dzaiyq57gOvhKVTB8SJlLUZLdCmXDhKEdkAFxItRSL1lPum43yLUeP1AM7z_/exec";

    function buscarAsistencia() {
      const codigo = document.getElementById('codigo').value.trim();
      const resDiv = document.getElementById('resultado');

      if (!codigo) {
        resDiv.innerHTML = "<p style='color:red; text-align:center;'>Ingrese un código válido.</p>";
        return;
      }

      resDiv.innerHTML = "<p style='text-align:center;'>⏳ Cargando registros...</p>";

      fetch(`${WEB_APP_URL}?action=consultar&qr=${encodeURIComponent(codigo)}`)
        .then(res => res.json())
        .then(data => {
          if (data.estado === 'ok') {
            let html = `<h3>Estudiante: ${data.nombre}</h3>`;
            if (data.registros.length === 0) {
              html += "<p>No posee registros de asistencia guardados.</p>";
            } else {
              html += `<table>
                <thead>
                  <tr><th>Fecha</th><th>Hora</th><th>Estado</th></tr>
                </thead>
                <tbody>`;
              data.registros.forEach(r => {
                html += `<tr><td>${r.fecha}</td><td>${r.hora}</td><td>${r.estado}</td></tr>`;
              });
              html += `</tbody></table>`;
            }
            resDiv.innerHTML = html;
          } else {
            resDiv.innerHTML = `<p style='color:red; text-align:center;'>❌ ${data.mensaje}</p>`;
          }
        })
        .catch(err => {
          resDiv.innerHTML = "<p style='color:red; text-align:center;'>❌ Error de conexión al consultar.</p>";
        });
    }
  </script>

</body>
</html>
