<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro de Nuevo Alumno</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; padding: 20px; margin: 0; }
    .card { max-width: 450px; margin: 20px auto; background: #fff; padding: 25px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    h2 { color: #1a73e8; margin-top: 0; text-align: center; }
    .form-group { margin-bottom: 15px; text-align: left; }
    label { display: block; font-weight: bold; margin-bottom: 5px; color: #333; }
    input { width: 100%; padding: 10px; font-size: 15px; border: 1px solid #ccc; border-radius: 8px; outline: none; }
    .uppercase-input { text-transform: uppercase; }
    button { width: 100%; padding: 12px; font-size: 16px; font-weight: bold; color: white; background-color: #1a73e8; border: none; border-radius: 8px; cursor: pointer; margin-top: 10px; }
    button:hover { background-color: #1557b0; }
    
    #secLogin { text-align: center; }
    #secForm { display: none; }

    #msg, #loginMsg { margin-top: 15px; padding: 10px; border-radius: 8px; text-align: center; font-weight: bold; display: none; }
    .ok { background-color: #d4edda; color: #155724; display: block !important; }
    .error { background-color: #f8d7da; color: #721c24; display: block !important; }

    /* Estilos para la vista de QR generado */
    #qrContainer { display: none; text-align: center; margin-top: 20px; border-top: 2px dashed #ddd; padding-top: 15px; }
    #qrContainer img { width: 180px; height: 180px; border: 1px solid #ddd; border-radius: 8px; padding: 5px; }
    .btn-ws { background-color: #25D366 !important; }
    .btn-ws:hover { background-color: #1eb954 !important; }
    .btn-down { background-color: #34a853 !important; }
    .btn-down:hover { background-color: #2d8e47 !important; }

    .nav { text-align: center; margin-top: 20px; border-top: 1px solid #eee; padding-top: 15px; }
    .nav a { color: #1a73e8; text-decoration: none; font-size: 14px; margin: 0 8px; font-weight: 500; }
  </style>
</head>
<body>

  <div class="card">
    
    <!-- PANTALLA 1: INGRESO DE CLAVE ENCARGADO -->
    <div id="secLogin">
      <h2>🔒 Acceso Restringido</h2>
      <p style="color: #666; font-size: 14px;">Ingrese la clave de encargado para registrar nuevos estudiantes.</p>
      
      <div class="form-group">
        <input type="password" id="pinInput" placeholder="Ingrese PIN" style="text-align: center; font-size: 18px;" onkeypress="if(event.key==='Enter') validarPin()">
      </div>
      
      <button type="button" onclick="validarPin()">Ingresar al Registro</button>
      <div id="loginMsg"></div>
    </div>

    <!-- PANTALLA 2: FORMULARIO DE REGISTRO -->
    <div id="secForm">
      <h2>📝 Registrar Nuevo Estudiante</h2>
      
      <form id="formAlumno" onsubmit="guardarAlumno(event)">
        <div class="form-group">
          <label>Código del Estudiante *</label>
          <input type="text" id="codigo" class="uppercase-input" placeholder="Ej: EST002" required>
        </div>

        <div class="form-group">
          <label>Nombres y Apellidos *</label>
          <input type="text" id="nombre" class="uppercase-input" placeholder="Ej: JUAN PÉREZ" required>
        </div>

        <button type="submit" id="btnGuardar">Guardar Estudiante</button>
      </form>

      <div id="msg"></div>

      <!-- SECCIÓN DE DESCARGA Y COMPARTIR QR -->
      <div id="qrContainer">
        <h3 id="qrAlumnoNombre" style="margin: 5px 0; color: #333;"></h3>
        <p id="qrAlumnoCodigo" style="margin: 0 0 10px 0; color: #666; font-size: 14px;"></p>
        <img id="qrImg" src="" alt="Código QR">
        
        <button type="button" class="btn-down" onclick="descargarQR()">📥 Descargar QR al Celular</button>
        <button type="button" class="btn-ws" onclick="compartirWhatsApp()">📲 Compartir por WhatsApp</button>
      </div>

    </div>

    <div class="nav">
      <a href="index.html">📷 Escáner</a> | 
      <a href="consulta.html">🔍 Consulta</a>
    </div>

  </div>

  <script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzwrXe5Dzaiyq57gOvhKVTB8SJlLUZLdCmXDhKEdkAFxItRSL1lPum43yLUeP1AM7z_/exec"; // Reemplaza con tu URL
    const PIN_CORRECTO = "1234"; 

    let datosRegistroActual = null;

    function validarPin() {
      const pinIngresado = document.getElementById('pinInput').value;
      const loginMsg = document.getElementById('loginMsg');

      if (pinIngresado === PIN_CORRECTO) {
        document.getElementById('secLogin').style.display = "none";
        document.getElementById('secForm').style.display = "block";
      } else {
        loginMsg.className = "error";
        loginMsg.innerText = "❌ Clave incorrecta. Acceso denegado.";
      }
    }

    function guardarAlumno(e) {
      e.preventDefault();
      const btn = document.getElementById('btnGuardar');
      const msg = document.getElementById('msg');
      const qrContainer = document.getElementById('qrContainer');

      btn.disabled = true;
      btn.innerText = "⏳ Guardando...";
      msg.className = "";
      msg.style.display = "none";
      qrContainer.style.display = "none";

      const codigo = document.getElementById('codigo').value.trim();
      const nombre = document.getElementById('nombre').value.trim();

      const urlFinal = WEB_APP_URL + 
        "?action=registrarAlumno" +
        "&codigo=" + encodeURIComponent(codigo) +
        "&nombre=" + encodeURIComponent(nombre);

      fetch(urlFinal, {
        method: 'GET',
        redirect: 'follow'
      })
      .then(response => {
        if (!response.ok) throw new Error("Error en la respuesta del servidor");
        return response.json();
      })
      .then(data => {
        btn.disabled = false;
        btn.innerText = "Guardar Estudiante";
        
        if (data.estado === 'ok') {
          msg.className = "ok";
          msg.innerText = "✅ " + data.mensaje;
          
          datosRegistroActual = data;

          // Mostrar tarjeta QR para descargar/compartir
          document.getElementById('qrAlumnoNombre').innerText = data.nombre;
          document.getElementById('qrAlumnoCodigo').innerText = "CÓDIGO: " + data.codigo;
          document.getElementById('qrImg').src = data.qrUrl;
          qrContainer.style.display = "block";

          document.getElementById('formAlumno').reset();
        } else {
          msg.className = "error";
          msg.innerText = "❌ " + data.mensaje;
        }
      })
      .catch(err => {
        console.error("Fetch Error:", err);
        btn.disabled = false;
        btn.innerText = "Guardar Estudiante";
        msg.className = "error";
        msg.innerText = "❌ Error al conectar con el servidor.";
      });
    }

    function descargarQR() {
      if (!datosRegistroActual) return;
      
      fetch(datosRegistroActual.qrUrl)
        .then(res => res.blob())
        .then(blob => {
          const blobUrl = URL.createObjectURL(blob);
          const link = document.createElement('a');
          link.href = blobUrl;
          link.download = `QR_${datosRegistroActual.codigo}.png`;
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
        })
        .catch(() => alert("No se pudo descargar directamente. Mantén presionada la imagen del QR para guardarla."));
    }

    function compartirWhatsApp() {
      if (!datosRegistroActual) return;
      const texto = `Hola *${datosRegistroActual.nombre}*, aquí tienes tu enlace directo para visualizar y guardar tu código QR de asistencia: ${datosRegistroActual.qrUrl}`;
      const urlWs = `https://api.whatsapp.com/send?text=${encodeURIComponent(texto)}`;
      window.open(urlWs, '_blank');
    }
  </script>

</body>
</html>
